name: Producer
on:
  pull_request:
    branches: [stable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Produce
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          sleep 120
          test "$RUN_ATTEMPT" -eq 1
